<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bienvenida</title>
		<style>
			:root {
				--bg: #f5f7fb;
				--surface: #ffffff;
				--text: #1f2937;
				--muted: #6b7280;
				--primary: #0f766e;
				--primary-dark: #115e59;
				--radius: 16px;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				color: var(--text);
				background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
			}

			.container {
				min-height: 100vh;
				width: min(1100px, 92%);
				margin: 0 auto;
				display: grid;
				grid-template-columns: 1.1fr 1fr;
				gap: 2rem;
				align-items: center;
				padding: 2rem 0;
			}

			.hero {
				background: var(--surface);
				border-radius: var(--radius);
				padding: 2rem;
				box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
			}

			.badge {
				display: inline-block;
				background: #ccfbf1;
				color: #134e4a;
				border-radius: 999px;
				padding: 0.35rem 0.8rem;
				font-size: 0.85rem;
				font-weight: 600;
				margin-bottom: 1rem;
			}

			h1 {
				margin: 0 0 1rem;
				font-size: clamp(1.8rem, 3vw, 2.8rem);
				line-height: 1.2;
			}

			p {
				margin: 0;
				color: var(--muted);
				line-height: 1.7;
			}

			.actions {
				margin-top: 1.5rem;
				display: flex;
				gap: 0.8rem;
				flex-wrap: wrap;
			}

			.btn {
				border: none;
				border-radius: 10px;
				padding: 0.8rem 1.1rem;
				font-weight: 600;
				cursor: pointer;
			}

			.btn-primary {
				background: var(--primary);
				color: #fff;
			}

			.btn-primary:hover {
				background: var(--primary-dark);
			}

			.btn-secondary {
				background: #e5e7eb;
				color: #111827;
			}

			.gallery {
				display: grid;
				gap: 1rem;
			}

			.gallery img {
				width: 100%;
				border-radius: var(--radius);
				object-fit: cover;
				box-shadow: 0 8px 25px rgba(15, 23, 42, 0.1);
			}

			.gallery img:first-child {
				aspect-ratio: 16 / 10;
			}

			.gallery img:last-child {
				aspect-ratio: 16 / 8;
			}

			@media (max-width: 820px) {
				.container {
					grid-template-columns: 1fr;
				}

				.hero {
					order: 2;
				}
			}
		</style>
	</head>
	<body>
		<main class="container">
			<section class="hero">
				<span class="badge">Tu nuevo comienzo</span>
				<h1>Bienvenido a tu próxima gran experiencia</h1>
				<p>
					Esta es una página de bienvenida básica para iniciar tu proyecto.
					Puedes personalizar textos, colores e imágenes fácilmente según tu marca.
				</p>
				<div class="actions">
					<button class="btn btn-primary" type="button">Comenzar</button>
					<button class="btn btn-secondary" type="button">Saber más</button>
				</div>
			</section>

			<section class="gallery" aria-label="Imágenes de ejemplo">
				<img
					src="https://placehold.co/800x500/e2e8f0/334155?text=Imagen+Placeholder+1"
					alt="Imagen de marcador de posición uno"
				/>
				<img
					src="https://placehold.co/800x400/c7d2fe/1e293b?text=Imagen+Placeholder+2"
					alt="Imagen de marcador de posición dos"
				/>
			</section>
		</main>
	</body>
</html>
